[package]
name = "xmip-core-library-postgresql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-library-postgresql"
description = "PostgreSQL's frontend/backend protocol 3.0, both halves: what a client and a server send, read and written; a client that logs in by trust or a cleartext password in the simple query flow; and the far end a test serves."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The estate's encoding primitives: the byte cursor and writer the fields
# are read and written over, and the constant-time comparison a far end
# checks a password with.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The connection opened inside one deadline (`net::connect`), the ceiling a
# message's length is held to (`net::MAX_BODY`), and the error a refusal
# travels in, a connection's keeping its kind.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# SQL: the PostgreSQL dialect a far end takes an INSERT apart in, and a
# statement's verb.
sql = { package = "xmip-core-library-sql", git = "https://github.com/IlleNilsson/xmip-core-library-sql", branch = "main" }

[lints]
workspace = true
